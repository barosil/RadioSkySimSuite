[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [
  "src/bingo",
  "src/analysis",
  "src/arpls",
  "src/GNSStools4Astro",
  "src/radioskysims",
]

# ─────────────────────────────────────────────────────────────
# Test / quality tooling
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
markers = [
  "integration: tests that depend on external libraries or heavy IO",
  "performance: performance and profiling tests (not run by default)",
]
filterwarnings = [
  "error",
  "ignore:Exception ignored in.*:pytest.PytestUnraisableExceptionWarning",
  "ignore:.*read_text is deprecated.*:DeprecationWarning",
  "ignore:.*open_text is deprecated.*:DeprecationWarning",
  "ignore:.*is not a Python type.*:UserWarning:pydantic",
  "ignore:structlog não instalado.*:ImportWarning:radioskysims.infrastructure.logging_config",
  "ignore:numpy.core.*:DeprecationWarning",
  "ignore:numpy.ndarray size changed.*binary incompatib:RuntimeWarning",
  "ignore:.*radioskysims.beam.models.Beam.*:DeprecationWarning",
  "ignore:.*vlen-utf8.*:UserWarning:zarr",
  "ignore:.*dtype.*not part.*Zarr format.*:UserWarning:zarr",
  "ignore:.*Consolidated metadata.*:UserWarning:zarr",
  "ignore:.*return type of.*Dataset.dims.*:FutureWarning",
]
log_cli_level = "INFO"
testpaths = [
  "tests",
]

[tool.coverage.run]
source = [
  "bingo",
  "analysis",
  "arpls",
  "gnsstools4astro",
  "GNSStools4Astro",
  "radioskysims",
  "radioskysims_core",
  "radioskysims_viz",
  "radioskysims_beam",
  "radioskysims_skymap",
  "radioskysims_sources",
  "radioskysims_radiotelescope",
  "radioskysims_simulation",
  "radioskysims_waterfall",
]

[tool.coverage.report]
exclude_also = [
  "\\.\\.\\.",
  "if typing.TYPE_CHECKING:",
]

[tool.mypy]
files = [
  "src",
  "tests",
  "packages",
]
python_version = "3.11"
warn_unused_configs = true
strict = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "radioskysims.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["*.ipynb"]
# Código vendorizado / fora de escopo (AGENTS.md) — não lintado nem formatado.
extend-exclude = [
  "src/arpls/**",
  "src/bingo/**",
  "src/GNSStools4Astro/**",
  "src/analysis/**",
  "src/domain/map/**",
]

[tool.ruff.format]

[tool.ruff.lint]
extend-select = [
  "ARG",      # flake8-unused-arguments
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "EXE",      # flake8-executable
  "G",        # flake8-logging-format
]
