[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# ─────────────────────────────────────────────────────────────
# Umbrella distribution `radioskysim`
#
# Composition root + CLI/GUI + extras seletivos.
# Os membros do workspace vivem em `packages/*` e são referenciados
# como path-dependencies via [tool.uv.sources].
# ─────────────────────────────────────────────────────────────

[project]
name = "radioskysim"
dynamic = ["version"]
description = "Domain driven developed app for simulations of radio sky seen by a single dish radiotelescope."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
authors = [
  { name = "Luciano Barosi", email = "lbarosi@df.ufcg.edu.br" },
  { name = "Vanderson Cavalcante" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "radioskysims-core",
  "radioskysims-beam",
  "radioskysims-viz",
  "radioskysims-skymap",
  "radioskysims-sources",
  "radioskysims-radiotelescope",
  "radioskysims-simulation",
  "radioskysims-waterfall",
  "gnsstools4astro",
  "python-dotenv>=1.0",
  "numpy>=2.3",
  "astropy>=7.1",
  "scipy>=1.11",
  "scikit-learn>=1.8.0",
  "cartopy>=0.25.0",
  "pandas>=2.2",
  "xarray>=2022.3.1,<2026.0.0",
  "skyfield>=1.53,<2.0",
  "sgp4>=2.24",
  "sqlmodel>=0.0.24",
  "pydantic>=2",
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "httpx>=0.28",
  "openpyxl>=3.1.5,<4.0.0",
  "panel>=1.7.0,<2.0.0",
  "holoviews>=1.20.2,<2.0.0",
  "hvplot>=0.10",
  "datashader>=0.16",
  "jupyter-bokeh>=4.0.5,<5.0.0",
  "georinex>=1.16.0,<2.0.0",
  "pyccl>=3.0.0,<4.0.0",
  "camb>=2.0.0,<3.0.0",
  "healpy>=1.17",
  "astroquery>=0.4.7",
  "pyvo>=1.7",
  "pysm3>=3.4",
  "reproject>=0.14",
  "matplotlib>=3.10",
  "h5py>=3.10",
  "h5netcdf>=1.2",
  "zarr>=3.0",
  "numcodecs>=0.13",
  "dask[distributed]>=2026.1.0,<2027.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.5,<9.1.0",
  "pytest-cov>=3",
]
dev = [
  "pytest>=8.3.5,<9.1.0",
  "pytest-cov>=3",
  "ruff>=0.9",
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "myst-nb>=1.0",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "pydata_sphinx_theme",
  "mystmd>=1.3.6",
]
# Extras seletivos por sub-pacote (populados conforme as fases avançam)
core = [
  "radioskysims-core",
]
viz = [
  "radioskysims-viz",
]
beam = [
  "radioskysims-beam",
]
skymap = [
  "radioskysims-skymap",
]
sources = [
  "radioskysims-sources",
]
radiotelescope = [
  "radioskysims-radiotelescope",
]
simulation = [
  "radioskysims-simulation",
]
gnss = [
  "gnsstools4astro",
]
waterfall = [
  "radioskysims-waterfall",
]
all = [
  "radioskysims-core",
  "radioskysims-viz",
  "radioskysims-beam",
  "radioskysims-skymap",
  "radioskysims-sources",
  "radioskysims-radiotelescope",
  "radioskysims-simulation",
  "radioskysims-waterfall",
]

[dependency-groups]
dev = [
  "radioskysim[test]",
  "ipykernel",
  "mypy>=2.3.1",
  "nbformat>=5.10.4",
  "nbclient>=0.10.2",
]


[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"
Discussions = "https://github.com/barosil/RadioSkySim/discussions"
Changelog = "https://github.com/barosil/RadioSkySim/releases"

[project.scripts]
radioskysims = "radioskysims.bootstrap.cli:main"
gnss4astro = "gnsstools4astro.bootstrap.gnss4astro_cli:main"

# ─────────────────────────────────────────────────────────────
# uv workspace
# ─────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
radioskysims-core = { workspace = true }
radioskysims-viz = { workspace = true }
radioskysims-beam = { workspace = true }
radioskysims-skymap = { workspace = true }
radioskysims-sources = { workspace = true }
radioskysims-radiotelescope = { workspace = true }
radioskysims-simulation = { workspace = true }
radioskysims-waterfall = { workspace = true }
gnsstools4astro = { workspace = true }

